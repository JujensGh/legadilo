{% load i18n %}

<div class="{% if vertical_group %}btn-group-vertical w-100{% else %}btn-group{% endif %}"
     role="group">
    <button class="btn btn-danger"
            type="button"
            data-modal-id="danger-modal"
            data-modal-title="{% translate 'Confirm article deletion' %}"
            data-modal-body="{% blocktranslate trimmed with article_title=article.title %}Are you sure you want to delete the article '{{ article_title }}'?{% endblocktranslate %}"
            hx-confirm="Delete?"
            hx-indicator=".{{ article|article_action_indicator }}"
            hx-post="{% url 'reading:delete_article' article.id %}"
            hx-vals='{"displayed_reading_list_id": {{ displayed_reading_list.id|default:"null" }}, "from_url": "{{ from_url }}", "for_article_details": {% if for_article_details %}true{% else %}false{% endif %} }'>
        <span class="icon-indicator {{ article|article_action_indicator }}">
            {% loading_indicator %}
            {% bs_icon "trash" %}
        </span>
        <span class="d-none d-md-inline">{% translate "Delete" %}</span>
    </button>
</div>
